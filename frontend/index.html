<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OAuth Flow - Área Protegida</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #f4f4f9; padding: 2rem; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        button { background: #4285F4; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 1rem; margin-bottom: 10px; width: 100%;}
        button:hover { background: #357ae8; }
        #protectedBtn { background: #0f9d58; }
        #protectedBtn:hover { background: #0b8043; }
        #logoutBtn { background: #db4437; display: none; }
        pre { background: #282c34; color: #abb2bf; padding: 1rem; border-radius: 4px; overflow-x: auto; font-size: 0.9rem;}
        .alert { padding: 10px; margin-bottom: 15px; border-radius: 4px; display: none; }
        .alert-error { background: #fad2e1; color: #721c24; border: 1px solid #f5c6cb; }
        .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Autenticação Institucional</h2>
        
        <div id="alertBox" class="alert"></div>

        <div id="loginArea">
            <p>Faça login com sua conta acadêmica (@ifc.edu.br) para continuar.</p>
            <button id="loginBtn">Login com Google</button>
        </div>

        <div id="dashboardArea" style="display: none;">
            <h3>Área do Aluno</h3>
            <p>Autenticado com sucesso. O seu JWT está armazenado localmente.</p>
            <button id="protectedBtn">Acessar Dados Restritos (API)</button>
            <button id="logoutBtn">Sair</button>
            
            <h4>Resposta do Servidor:</h4>
            <pre id="apiResponse">// Nenhuma requisição feita ainda...</pre>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
